<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061525">
  <meta name="apple-mobile-web-app-title" content="CPool Admin">
  <title>CPool Admin</title>
  <link rel="manifest" href="/admin.webmanifest">
  <link rel="apple-touch-icon" href="/cpool-logo.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #061525; color: #fff; font-family: Georgia, serif; }
    main { max-width: 560px; margin: auto; }
    h1 { margin: 0; padding: calc(28px + env(safe-area-inset-top)) 8% 10px; font-size: clamp(2.15rem, 8.7vw, 3.4rem); font-weight: 400; }
    h1::after { content: ""; display: block; width: 22%; height: 2px; margin-top: 14px; background: linear-gradient(90deg, #d5dce2, transparent); }
    .hero { aspect-ratio: 1.12; background: linear-gradient(0deg, #061525, transparent 23%), url("/admin-billar.webp") center 31% / 100% auto no-repeat; }
    nav {
      display: grid;
      gap: 10px;
      margin: 0 5%;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
    }
    nav a {
      display: grid;
      grid-template-columns: 2.7rem minmax(0, 1fr) 1.15rem;
      gap: .8rem;
      align-items: center;
      min-height: 64px;
      padding: 8px 12px;
      border: 1px solid #546d7d;
      border-radius: 8px;
      background: linear-gradient(115deg, #142d40, #0a1c30 75%);
      box-shadow: inset 0 1px #d7ecff18;
      color: #f6f7fa;
      font: 600 clamp(1.12rem, 5.5vw, 1.55rem)/1.2 system-ui, sans-serif;
      letter-spacing: .01em;
      text-decoration: none;
    }
    nav a:focus-visible { outline: 2px solid #c9e9ff; outline-offset: 3px; }
    nav a:active { background: #214359; }
    .action-icon {
      display: grid;
      min-height: 33px;
      place-items: center;
      padding-right: 8px;
      border-right: 1px solid #90a8b450;
      color: #d4e3ec;
    }
    .action-icon svg { display: block; width: 29px; height: 29px; }
    .arrow { width: 17px; height: 17px; color: #b6d4e4; }
  </style>
</head>
<body>
  <main>
    <h1>CPool Admin</h1>
    <div class="hero" aria-hidden="true"></div>
    <nav aria-label="Administració del torneig">
      <a href="/control"><span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="15" rx="2"/><path d="M7 3v4m10-4v4m-5 1v9"/><circle cx="7.25" cy="13" r="1.5"/><circle cx="16.75" cy="13" r="1.5"/></svg></span>Marcadors<svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></a>
      <a href="/quadrant-control"><span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h5v6H2m0 6h5v6H2M7 6h5v12H7m5-6h9"/></svg></span>Quadrant<svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></a>
      <a href="/admin.html#admin-tv">
        <span class="action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10 6-3v10l-6-3"/></svg></span>
        <span>Control de vídeo · TV Table 1 i 2</span>
        <svg class="arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
      </a>
    </nav>
  </main>
</body>
</html>
